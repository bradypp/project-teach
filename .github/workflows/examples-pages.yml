name: Publish example notebook

on:
  push:
    branches: [main]
    paths:
      - 'examples/.learning/**'
      - '.agents/skills/learning/teach/scripts/check_links.py'
      - '.github/workflows/examples-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check notebook links
        run: python3 .agents/skills/learning/teach/scripts/check_links.py examples/.learning
      - name: Prepare public notebook
        run: |
          mkdir -p _site
          cp -a examples/.learning/. _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
