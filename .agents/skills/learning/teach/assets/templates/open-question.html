<!-- Optional fieldset to insert inside the quiz form. Use unique label/textarea IDs. -->
<fieldset class="card" data-question>
  <legend>
    Replace with a project-grounded prediction or reasoning question
  </legend>
  <label for="reasoning-1">Your reasoning</label>
  <textarea
    id="reasoning-1"
    placeholder="Try the question before revealing the explanation."
  ></textarea>
  <details data-self-check>
    <summary>Compare your reasoning</summary>
    <div data-explanation>
      <p>
        Replace with a worked explanation and what to look for in your answer.
      </p>
      <!-- Add the relevant relative lesson link here. -->
    </div>
  </details>
</fieldset>
