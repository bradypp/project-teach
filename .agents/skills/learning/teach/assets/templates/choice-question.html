<!-- Quick-fire choice: author and enable before delivery. Keep one radio group per
     data-question, unique names/IDs, and exactly one data-correct="true" option.
     Add a labelled textarea before checking when the reasoning matters. -->
<fieldset data-question disabled>
  <legend>Author a question tied to the current context</legend>
  <label class="option"
    ><input type="radio" name="q1" value="a" data-correct="true" />Replace with
    the correct option</label
  >
  <label class="option"
    ><input type="radio" name="q1" value="b" />Replace with a plausible
    alternative</label
  >
  <details data-hint>
    <summary>A hint</summary>
    <p>Replace with a useful nudge that preserves the challenge.</p>
  </details>
  <button type="button" data-check>Check answer</button>
  <p class="feedback" data-feedback aria-live="polite" hidden></p>
  <div data-explanation hidden>
    <h3>Why this works</h3>
    <p>Replace with reasoning that explains both options.</p>
    <!-- Add relative lesson link, e.g. ../lessons/queue-backpressure.html -->
  </div>
</fieldset>
